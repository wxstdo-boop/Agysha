AutoName: Agysha
Summary: Alarm you cannot snooze away, plus tasks, habits and one assistant

RepoType: git
Repo: https://github.com/wxstdo-boop/Agysha.git

Builds:
  - versionName: 1.6.327
    versionCode: 45403
    commit: 4ca93b49632a35357a4d5849226b630922573403
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\s*'(.*)'/\1/p" .github/workflows/release.yml
        | head -1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i -e '/signingConfig = signingConfigs.getByName("release")/d' android/app/build.gradle.kts
      - sed -i -e '/REQUEST_INSTALL_PACKAGES/d' android/app/src/main/AndroidManifest.xml
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - echo "flutter.sdk=$$flutter$$" >> android/local.properties
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define=AGYSHA_NO_SELF_UPDATE=true
    ndk: 28.2.13676358

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+\+[0-9]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
