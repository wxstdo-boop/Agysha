AutoName: Agysha
Summary: Alarm clock that won't let you snooze back to sleep
Description: |-
  Agysha is a free and open-source alarm clock that will not let you go back to
  sleep. Alarms, tasks, habits, nutrition tracking and an optional AI assistant
  live in one Material You app.

  Alarms
  * Exact alarms via SCHEDULE_EXACT_ALARM and a foreground service that keeps the process alive
  * Wake tasks: attach a task you must complete to switch the alarm off
  * Survives a reboot - alarms are rescheduled automatically
  * Full-screen intent, so the alarm shows above the lock screen
  * Five built-in sounds: classic, default, digital, gentle, nature

  Tasks and habits
  * Tasks with priority, due date and repeat rules
  * Habits with streaks and daily or total goals
  * Reality checks - an honest "are you lying to yourself?" prompt
  * Swipe to delete, drag to reorder, springy animations

  Nutrition
  * Meals, macro goals and 30-day trends
  * Ring progress for every goal

  Ada, the assistant
  Ada understands plain speech ("set an alarm for 7 am on weekdays"), creates,
  edits and deletes alarms, tasks, habits, checks and meals, and can undo her
  last action. She runs in a small window above other apps and can use free
  public model providers with no account of your own. An API key, if you add
  one, is stored only on the device. This is the only feature that uses the
  network, and it is optional.

  Privacy and system
  * PIN lock and an app lock screen
  * Local encrypted storage, no ads, no trackers, no Google Play Services
  * Export all your data as a single file
  * Material You dynamic colours plus a dark theme
  * Localisation: English, Russian, French

  In-app updates are disabled in the F-Droid build; F-Droid updates the app.

  Requires Android 8.0 (API 26) or newer.

RepoType: git
Repo: https://github.com/wxstdo-boop/Agysha.git

Builds:
