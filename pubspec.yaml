name: agysha
description: "FOSS alarm clock with tasks — Material You design."
publish_to: 'none'
# versionCode должен быть строго ВЫШЕ установленного на телефоне, иначе
# `adb install -r` падает с INSTALL_FAILED_VERSION_DOWNGRADE. У split-APK
# Flutter прибавляет к номеру из pubspec индекс ABI (v7a +1000, arm64 +2000),
# т.е. для arm64 Flutter прибавляет 2000 к номеру базы. На телефоне сейчас
# 47125 (1.6.53), поэтому номер базы должен быть не ниже 45126.
# Обновление ставится поверх старого с сохранением данных (PIN, будильники).
version: 1.6.308+45382

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # Набор версий подобран под Flutter 3.50 / Dart 3.14. file_picker 13 и
  # flutter_local_notifications 23 требуют win32 ^6 — возврат file_picker к ^10
  # ломает solve, не откатывать без нужды.
  #
  # Раньше здесь стоял share_plus: ^13.3.1, и комментарий утверждал, что его
  # удаление «откатывает file_picker и flutter_local_notifications на старые
  # major-версии и ломает компиляцию». Это проверено и НЕ так: `flutter pub
  # remove share_plus` удаляет ровно share_plus, share_plus_platform_interface и
  # mime, а file_picker (13.3.2), flutter_local_notifications (23.0.0) и win32
  # (6.4.0) остаются на тех же версиях. Сам share_plus в коде не использовался:
  # `grep -rn "share_plus" lib test` пуст, а упоминания встречались только в
  # генерируемых registrant-файлах, которые появляются именно потому, что
  # пакет объявлен в зависимостях.
  # 2.x перешёл на пакет `material_ui` и отдаёт ЕГО ColorScheme: с
  # `package:flutter/material.dart` типы несовместимы. Обновлять вместе с
  # переездом всего приложения на material_ui, не раньше.
  dynamic_color: ^1.9.0
  characters: ^1.4.1
  cryptography: ^2.7.0
  # SHA-256 отпечатка файла: защита подборки музыки от повторного добавления
  # одного и того же звука. Пакет и так приходил транзитивно (см. pubspec.lock).
  crypto: ^3.0.8
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.0
  uuid: ^4.5.1
  audioplayers: ^6.1.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  file_picker: ^13.4.1
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  url_launcher: ^6.3.1
  android_intent_plus: ^6.1.0

  path_provider: ^2.1.0
  # Локальный форк: регистрирует плагины в оверлейном движке
  # (иначе в мини-окошке нет prefs/path_provider — история пустая,
  # ИИ не отвечает) и убирает текст уведомления.
  flutter_overlay_window:
    path: third_party/flutter_overlay_window
  # Локальный форк: pub-версия 6.0.0 компилирует android-библиотеку с
  # compileSdk 31 и падает на AAR-метаданных (androidx требует 33+).
  # Сконвертировали форк с compileSdk 36.
  flutter_keyboard_visibility:
    path: third_party/flutter_keyboard_visibility
  http: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/agysha.png
    - assets/agysha_art.png
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-400.ttf
          weight: 400
        - asset: assets/fonts/Caveat-500.ttf
          weight: 500
        - asset: assets/fonts/Caveat-600.ttf
          weight: 600
        - asset: assets/fonts/Caveat-700.ttf
          weight: 700
    # Roboto с широким em dash — для тире в режиме Caveat (см. WideDashController).
    # Бандлим его: fontFamily 'Roboto' НЕ бандлится и на устройстве не
    # резолвится, из-за чего глиф тире падал обратно в Caveat и оставался узким.
    - family: RobotoDash
      fonts:
        - asset: assets/fonts/RobotoDash-400.ttf
          weight: 400
        - asset: assets/fonts/RobotoDash-700.ttf
          weight: 700
