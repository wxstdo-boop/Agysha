name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --concurrency=1 --coverage

      - name: Итог по покрытию
        # Покрытие — только отчёт, не гейт: доля тестов, работающих с реальным
        # I/O и платформенными каналами, lcov считает неточно (недостижимые в
        # тест-среде ветки нативных вызовов), поэтому порог в CI ставить рано.
        # Считаем lcov штатными инструментами раннера (awk), без сторонних
        # action'ов и скриптов: сумма LH/LF по всем SF-записям.
        if: always() && hashFiles('coverage/lcov.info') != ''
        run: |
          set -euo pipefail
          read -r HIT TOTAL < <(awk '
            /^LH:/{h+=substr($0,4)}
            /^LF:/{t+=substr($0,4)}
            END{print h, t}' coverage/lcov.info)
          if [ "$TOTAL" -eq 0 ]; then echo "lcov пуст: покрытие не измерено"; exit 0; fi
          PCT=$(awk "BEGIN{printf \"%.1f\", 100*$HIT/$TOTAL}")
          {
            echo "### Покрытие кода тестами"
            echo ""
            echo "| Метрика | Значение |"
            echo "|---|---|"
            echo "| Покрытие строк | ${PCT}% (${HIT}/${TOTAL}) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Покрытие строк: ${PCT}% (${HIT}/${TOTAL})"

      - name: Залить lcov как артефакт
        # Артефакт на 90 дней: можно локально посчитать недостроенные области
        # (genhtml, lcov --remove) или подключить бейдж/барадж позже.
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 90

  lint-workflows:
    # Синтаксис и семантика workflow-файлов. Ловит то, что YAML-парсер не
    # видит: `needs.x.outputs.y` без объявленного `outputs:` у job (именно так
    # релиз по тегу собирался с версией «+»), неверные `uses:`, пропущенные
    # `secrets`, невалидные if-выражения. Всё это GitHub раскрывает только в
    # момент запуска прогона, то есть уже на реальном релизе.
    #
    # Версия пинится: раньше бинарь actionlint лежал в коммите (5.1 МБ ELF в
    # корне репозитория). Для F-Droid это минус («репозиторий должен
    # собираться из исходников») и плюс к размеру клона, поэтому теперь его
    # скачиваем по точному релизному tarball.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Скачать actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          set -euo pipefail
          VER="$ACTIONLINT_VERSION"
          BASE="https://github.com/rhysd/actionlint/releases/download/v${VER}"
          FILE="actionlint_${VER}_linux_amd64.tar.gz"
          DEST="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$DEST"
          # Суммы у actionlint лежат ОДНИМ файлом на релиз
          # (actionlint_<ver>_checksums.txt), а не рядом с каждым tarball как
          # <file>.sha256 — последнего на GitHub 404. Без сверки CDN мог бы
          # отдать любой ответ под видом валидера.
          curl -sSLf -o "$DEST/$FILE" "$BASE/$FILE"
          curl -sSLf -o "$DEST/checksums.txt" "$BASE/actionlint_${VER}_checksums.txt"
          (cd "$DEST" && grep "  ${FILE}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$DEST/$FILE" -C "$DEST" actionlint
          # В $GITHUB_PATH кладутся КАТАЛОГИ. Первая версия шага добавляла туда
          # путь к самому бинарю (/tmp/actionlint), и шаг падал с exit 127
          # «command not found» — то есть линтер вообще не запускался.
          echo "$DEST" >> "$GITHUB_PATH"

      - name: Проверить workflow-файлы
        # На раннере есть shellcheck, локально его нет — поэтому часть
        # замечаний видна только здесь. Гло заглушен ровно один код:
        # SC2129 («лучше { cmd1; cmd2; } >> file, чем три редиректа») — это
        # стиль, он ничего не меняет в корректности, а относится к записи в
        # $GITHUB_OUTPUT в ship.yml, release-on-tag.yml и release-watchdog.yml.
        # Трогать рабочий релизный shell ради косметики рискованнее, чем держать
        # на него исключение; все остальные проверки actionlint продолжают
        # фейлить CI.
        run: actionlint -ignore 'SC2129'

  dependency-review:
    # Только для PR: diff двух lockfiles даёт список новых пакетов и их
    # известные уязвимости (GitHub Advisory Database). На push в main смысла
    # нет — там diff пустой.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          # Пока только комментируем, не блокируем: у проекта транзитивные
          # зависимости от Flutter-пакетов, и hard-fail на первом же
          # нерелевантном advisory заблокировал бы любой PR.
          fail-on-severity: critical
          comment-summary-in-pr: always
