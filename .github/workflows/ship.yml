name: ship

# Автозапуск релиза по пушу в main.
#
# Здесь ТОЛЬКО две вещи: поднять версию и позвать общий процесс сборки
# `.github/workflows/release.yml`. Сборка, проверки, подпись и публикация
# живут в одном месте — иначе два релиз-процесса рано или поздно разъезжаются
# (так и вышло: тег-сборка не проверяла lockfile, не гоняла тесты и брала
# плавающий SDK).
#
# Триггеры:
#   1. Push в main (когда изменились lib/, android/, test/, ios/, web/, ship.yml
#      сам). Автоматически поднимает patch-версию и публикует GitHub Release.
#   2. Ручной запуск (workflow_dispatch) — выбор bump (patch/minor/none),
#      заметки и dry_run.
#
# Защита от рекурсии:
#   — paths-фильтр: триггер реагирует только на изменения в исходниках
#     и на ship.yml сам (не на pubspec.yaml / pubspec.lock — они меняются
#     в коммите «release: v…» и не должны перезапускать воркфлоу).
#   — if: на job: пропускает, если коммит начинается с «release:»
#     (это коммит, который сам ship делает для бампа версии).
#
# Результат: пуш кода → auto-release → UpdateService в приложении видит
# releases/latest → показывает UpdatePill → пользователь обновляет.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Тип бампа версии'
        type: choice
        options:
          - patch
          - minor
          - none
        default: patch
      notes:
        description: 'Заметки к релизу (пусто = GitHub сгенерирует сам)'
        required: false
        default: ''
      dry_run:
        description: 'Только сборка, без коммита и релиза'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'ios/**'
      - 'web/**'
      - '.github/workflows/ship.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  bump:
    # Пропускаем триггер на push, если коммит начинается с «release:»
    # (это бамп, который сам ship сделал — не нужен рекурсивный запуск).
    # Для workflow_dispatch (ручной) условие всегда true.
    # Force-push в main (github.event.forced=true) релиз НЕ запускает:
    # paths-фильтр видит изменённые файлы во всей переписанной истории и
    # выпускал релиз «на пустом месте» (так вышло с v1.6.79+45151 после
    # переписи истории). Повисший после force-push настоящий бамп не теряется:
    # release-watchdog.yml сравнивает версию из pubspec с releases/latest и
    # зовёт release.yml сам.
    # Маркер «[skip ship]» в сообщении коммита НЕ выпускает релиз. Нужен для
    # промежуточных пушей («polish», WIP, правки документации в lib/), которых
    # за сутки набиралось до 18 — каждый давал релиз, 3 APK и уведомление всем
    # следящим за репозиторием.
    #
    # Работает без правок в release-watchdog.yml, и вот почему: маркер гасит
    # весь job bump, то есть pubspec.yaml НЕ бампится и тег не создаётся.
    # Значит версия main остаётся равней уже опубликованной, и watchdog на
    # своём условии «LTAG = TAG → всё на месте» догонять нечего. Когда после
    # серии пропущенных пушей приходит обычный коммит, bump выпускает ОДИН
    # релиз со всем накопленным — это и есть release train.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, 'release:') &&
      github.event.forced != true &&
      !contains(github.event.head_commit.message, '[skip ship]'))
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
      tag: ${{ steps.ver.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Бамп версии
        id: ver
        run: |
          set -euo pipefail
          CUR=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME=${CUR%%+*}
          CODE=${CUR##*+}
          MAJOR=${NAME%%.*}
          REST=${NAME#*.}
          MINOR=${REST%%.*}
          PATCH=${REST##*.}
          # При push-триггере inputs.bump пуст — дефолт patch.
          BUMP="${{ inputs.bump }}"
          [ -z "$BUMP" ] && BUMP="patch"
          case "$BUMP" in
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            none)  ;;
            *) echo "Неизвестный bump: $BUMP"; exit 1 ;;
          esac
          NAME="$MAJOR.$MINOR.$PATCH"
          CODE=$((CODE + 1))
          TAG="v${NAME}+${CODE}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Тег ${TAG} уже существует в истории — не буду переиспользовать"
            exit 1
          fi
          sed -i "s/^version: .*/version: ${NAME}+${CODE}/" pubspec.yaml
          # `kAppVersion` в lib/services/app_version.dart обязан совпадать с
          # versionName из pubspec.yaml — иначе регрессионный тест
          # app_version_test.dart роняет сборку релизa, а пользователь в
          # «О приложении» видит версию прошлого релиза. Бамп обновляет
          # и pubspec.yaml, и эту константу — иначе первый же авторелиз
          # после этого коммита был бы красным.
          if [ -f lib/services/app_version.dart ]; then
            sed -i -E "s/^const String kAppVersion = '[^']*';/const String kAppVersion = '${NAME}';/" lib/services/app_version.dart
            grep -n "kAppVersion" lib/services/app_version.dart
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Собираем ${TAG}"

      - name: Заметки из коммитов
        id: notes
        # Авторелиз идёт ПУШЕМ, а не через pull request, поэтому у GitHub нет
        # ни одного PR, из которого он собрал бы «What's Changed» — в теле
        # релиза оставалась одна таблица SHA-256, и «Что нового» показывало
        # заголовки без пунктов. Здесь собираем заметки сами: список коммитов
        # от прошлого тега до текущего HEAD.
        #
        # Ручной запуск с непустым notes имеет приоритет — автор задал текст сам.
        env:
          MANUAL_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL_NOTES" ]; then
            # Многострочные заметки нельзя писать как notes=строка: строка
            # вторая и дальше не проходит формат $GITHUB_OUTPUT, и весь bump
            # падал с «Invalid format» ещё до сборки APK.
            {
              echo "notes<<EOF"
              printf '%s\n\n' "$MANUAL_NOTES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Заметки заданы вручную"
            exit 0
          fi
          # Якорь диапазона — НЕ тег прошлого релиза, а сам релизный коммит.
          #
          # Тег указывает на main-HEAD в момент публикации, а не на коммит
          # «release: v…»: при авторелизе по пушу ship сначала пушит бамп-коммит,
          # main успевает уйти вперёд, и тег ложится на более поздний коммит
          # (для v1.6.114 тег = merge-коммит PR #19). Тогда «тег..HEAD» следующего
          # релиза повторно захватывает коммиты, уже вошедшие в прошлый релиз, —
          # и один и тот же пункт кочует из релиза в релиз. Именно поэтому в
          # v1.6.113 и v1.6.114 стояла одна и та же строка.
          #
          # Релизный коммит «release: v…» однозначен и лежит на первом родителе
          # текущего HEAD, поэтому берём его. Тег оставляем фолбэком на случай,
          # когда релизного коммита в истории нет (например, релиз собран
          # вручную по тегу).
          PREV_TAG=$(git describe --tags --abbrev=0 'HEAD^' 2>/dev/null || true)
          PREV_RELEASE=$(git rev-list -n1 --grep='^release: ' 'HEAD^' 2>/dev/null || true)
          if [ -n "$PREV_RELEASE" ]; then
            RANGE="${PREV_RELEASE}..HEAD"
          elif [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          # --sections: тело релиза читают люди, поэтому у него есть короткий
          # ввод, блоки «Новое / Плавнее / Починили» и подпись. Flat-режим
          # (без флага) остаётся для fastlane, где F-Droid режет текст по 500
          # символам и любой заголовок съедает пункт.
          # Заголовки коммитов плюс их тело: в теле мы пишем, что именно
          # поменялось для человека, и раньше эти пункты до релиза не доезжали.
          NOTES="$( { git log --no-merges --pretty=format:'- %s' "$RANGE"; echo
            git log --no-merges --pretty=format:'%b' "$RANGE" | awk '
              /^- /{if (b != "") print b; b = $0; next}
              /^[[:space:]]+[^[:space:]]/{sub(/^[[:space:]]+/, "", $0); b = b " " $0}
              END{if (b != "") print b}'
          } | bash tool/release_notes.sh --sections || true)"
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            NOTES="- ✨ Обновление и мелкие улучшения"
          fi
          {
            echo "notes<<EOF"
            printf '%s\n' "$NOTES"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Заметки собраны из ${RANGE}"

      - name: Changelog для F-Droid
        # fdroiddata читает fastlane-заметки ИЗ КОММИТА, на который смотрит
        # рецепт. Тег релиза указывает на этот самый «release: v…» коммит, а
        # он трогал только pubspec/app_version — changelog, добавленный
        # автором в предыдущем коммите, в тег не попадал, и на странице
        # «Что нового» у ревьюера было пусто. Поэтому генерим файл
        # <versionCode>.txt из тех же коммитов, что и заметки релиза, и
        # коммитим его вместе с бампом.
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MANUAL_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          CODE="${{ steps.ver.outputs.code }}"
          DIR="fastlane/metadata/android/en-US/changelogs"
          FILE="${DIR}/${CODE}.txt"
          if [ -f "$FILE" ]; then
            echo "Changelog ${CODE}.txt уже есть — оставляю как есть"
            exit 0
          fi
          mkdir -p "$DIR"
          PREV_RELEASE=$(git rev-list -n1 --grep='^release: ' 'HEAD^' 2>/dev/null || true)
          PREV_TAG=$(git describe --tags --abbrev=0 'HEAD^' 2>/dev/null || true)
          if [ -n "$PREV_RELEASE" ]; then
            RANGE="${PREV_RELEASE}..HEAD"
          elif [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          if [ -n "$MANUAL_NOTES" ]; then
            printf '%s\n' "$MANUAL_NOTES" > "$FILE"
          else
            git log --no-merges --pretty=format:'- %s' "$RANGE" \
              | bash tool/release_notes.sh > "$FILE" || true
          fi
          # F-Droid отбрасывает пустой changelog — подстраховываемся.
          [ -s "$FILE" ] || printf -- '- Обновление\n' > "$FILE"
          # Лимит F-Droid — 500 символов; длинный текст обрезаем с «...».
          # Режем по границе символа: `head -c` рвал многобайтовую кириллицу
          # и оставлял файл с битым UTF-8, из-за чего падал release_notes_test.
          python3 - "$FILE" <<'PY'
          import sys
          path = sys.argv[1]
          lines = [l for l in open(path, encoding='utf-8').read().splitlines() if l.strip()]
          if len(("\n".join(lines)).encode()) > 500:
              out, used = [], 0
              for line in lines:
                  size = len((line + "\n").encode())
                  if used + size > 460:
                      break
                  out.append(line)
                  used += size
              open(path, 'w', encoding='utf-8').write("\n".join(out) + "\n...\n")
          PY
          echo "Сгенерирован ${FILE}:"
          cat "$FILE"

      - name: Коммит версии
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "Wetidom"
          git config user.email "wxstdo@gmail.com"
          # kAppVersion обновляется бампом вместе с pubspec.yaml — иначе
          # следующий же регрессионный тест упадёт на расхождении версий.
          # changelog кладём в тот же коммит: fdroiddata читает его именно
          # из коммита рецепта, иначе «Что нового» пустое.
          git add pubspec.yaml pubspec.lock lib/services/app_version.dart \
            "fastlane/metadata/android/en-US/changelogs/${{ steps.ver.outputs.code }}.txt"
          git commit -m "release: ${{ steps.ver.outputs.tag }}"
          # Только main: бамп не задевает forge и другие ветки.
          # Пуш в main не перезапустит воркфлоу: коммит "release: v…" отсекается
          # условием job (сообщение начинается с "release:"), даже если он
          # задевает lib/ — paths-фильтр тут не единственная защита.
          #
          # Пока прогон собирался, в main мог приехать чужой коммит (правка
          # документации, хотфикс) — тогда прямой push отклоняется как
          # non-fast-forward, и релиз молча не выходит. Поэтому подтягиваем
          # свежий main ребейзом и пробуем ещё раз.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "::warning::push отклонён (попытка $attempt) — подтягиваю свежий ${GITHUB_REF_NAME}"
            git fetch -q origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; sleep 10; continue; }
            sleep 5
          done
          echo "::error::Не удалось запушить бамп версии: main уезжает быстрее, чем идёт релиз"
          exit 1

  publish:
    # Сборка и публикация — общий процесс, тот же, что и по тегу.
    #
    # `runs-on` здесь НЕЛЬЗЯ: job, который вызывает reusable workflow через
    # `uses:`, не может задавать раннер — его выбирает вызываемый workflow.
    # С `runs-on` GitHub не разбирает файл целиком: прогон падает за секунду
    # с нулём job'ов, а в списке он называется путём `.github/workflows/ship.yml`
    # вместо `ship`. Именно так авторелиз молча не запускался.
    needs: bump
    uses: ./.github/workflows/release.yml
    with:
      version_name: ${{ needs.bump.outputs.name }}
      version_code: ${{ needs.bump.outputs.code }}
      tag: ${{ needs.bump.outputs.tag }}
      # Заметки собирает bump (из коммитов, если автор не задал вручную).
      # Пуш-триггер не имеет inputs.notes, и без этого тело релиза оставалось
      # с одной таблицей SHA-256 — «Что нового» показывал пустые пункты.
      notes: ${{ needs.bump.outputs.notes }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
